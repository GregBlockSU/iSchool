<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jeopardy Grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: #0b1a4a;
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding-top: 40px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(4, 180px);
      grid-template-rows: repeat(4, 140px);
      gap: 12px;
    }

    .square {
      background: #011f5b;
      border: 3px solid #d3a625;
      color: #fff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      text-transform: uppercase;
      cursor: pointer;
      transition: 0.2s;
    }

    .square.visited {
      color: #c0c0c0;
      filter: grayscale(0.3);
      opacity: 0.65;
    }
  </style>
</head>
<body>

<div id="board"></div>
<script src="clues3.js"></script>
<script>

  // Save visited squares
  const VISITED_KEY = "visitedSquares";
  const visited = new Set(JSON.parse(sessionStorage.getItem(VISITED_KEY) || "[]"));

  function saveVisited() {
    sessionStorage.setItem(VISITED_KEY, JSON.stringify([...visited]));
  }

  const board = document.getElementById("board");

  CARD_DATA.forEach((card, index) => {
    const div = document.createElement("div");
    div.className = "square";
    div.textContent = card.title;
    div.dataset.id = index;

    if (visited.has(index)) div.classList.add("visited");

    div.onclick = () => {
      visited.add(index);
      saveVisited();
      div.classList.add("visited");

      // Store full card in session storage for clue page
      sessionStorage.setItem("currentCard", JSON.stringify(card));

      window.location.href = "clue.html";
    };

    board.appendChild(div);
  });
</script>

</body>
</html>
